cubes:
  - name: sales
    sql_table: public.sales

    measures:
      - name: count
        type: count

      - name: total_revenue
        sql: revenue
        type: sum

      - name: total_profit
        sql: profit
        type: sum

      - name: total_quantity
        sql: quantity
        type: sum

      - name: average_order_revenue
        sql: revenue
        type: avg

      - name: profit_margin
        sql: "100.0 * SUM(profit) / NULLIF(SUM(revenue), 0)"
        type: number

    dimensions:
      - name: order_id
        sql: order_id
        type: string
        primary_key: true

      - name: order_date
        sql: order_date
        type: time

      - name: customer_id
        sql: customer_id
        type: string

      - name: product_id
        sql: product_id
        type: string

      - name: product_name
        sql: product_name
        type: string

      - name: category
        sql: category
        type: string

      - name: region
        sql: region
        type: string

      - name: country
        sql: country
        type: string

      - name: sales_channel
        sql: sales_channel
        type: string
      